<!DOCTYPE html>
<html lang="fr" data-theme="clair">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Apercu de demonstration du portfolio d'equipe LOG3500 - ISTEAH.">
<title>Portfolio d'equipe | LOG3500 - ISTEAH (apercu)</title>
<style>
/* ===== variables.css ===== */
/* ==========================================================================
   variables.css — Charte visuelle et bascule de styles (mode clair / sombre)
   La bascule est pilotee par l'attribut data-theme place sur <html> par le
   fournisseur de contexte (Context API). Aucun framework CSS n'est utilise.
   Les couples texte/fond respectent un rapport de contraste superieur a 4,5:1
   (regle WCAG 2.1 AA).
   ========================================================================== */

:root {
  /* Palette de base — mode clair */
  --couleur-fond: #f7f8fb;
  --couleur-fond-alterne: #edeff5;
  --couleur-surface: #ffffff;
  --couleur-surface-appuyee: #e9ecf3;
  --couleur-bordure: #d3d8e3;
  --couleur-texte: #16181d;
  --couleur-texte-discret: #4a5160;
  --couleur-accent: #1d4ed8;
  --couleur-accent-appuye: #163bb0;
  --couleur-accent-contraste: #ffffff;
  --couleur-succes-fond: #dcfce7;
  --couleur-succes-texte: #14532d;
  --couleur-echec-fond: #fee2e2;
  --couleur-echec-texte: #7f1d1d;
  --couleur-avertissement-fond: #fef3c7;
  --couleur-avertissement-texte: #713f12;
  --couleur-focus: #b45309;
  --couleur-voile-accent: rgba(29, 78, 216, 0.16);

  /* Typographie */
  --police-principale: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  --police-monospace: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
  --taille-base: 1rem;
  --hauteur-ligne: 1.65;

  /* Espacements (echelle reguliere) */
  --espace-xs: 0.375rem;
  --espace-s: 0.75rem;
  --espace-m: 1.25rem;
  --espace-l: 2rem;
  --espace-xl: 3.25rem;

  /* Formes et ombres */
  --rayon-s: 6px;
  --rayon-m: 12px;
  --ombre-basse: 0 1px 3px rgba(15, 23, 42, 0.08);
  --ombre-moyenne: 0 6px 18px rgba(15, 23, 42, 0.10);

  /* Gabarit */
  --largeur-conteneur: 1160px;
  --largeur-conteneur-etroit: 780px;
  --duree-transition: 180ms;
}

/* Mode sombre — redefinition des seules variables de couleur. */
[data-theme='sombre'] {
  --couleur-fond: #0e1117;
  --couleur-fond-alterne: #151a23;
  --couleur-surface: #1a212c;
  --couleur-surface-appuyee: #232c3a;
  --couleur-bordure: #313d4f;
  --couleur-texte: #f1f4f9;
  --couleur-texte-discret: #b3bdcd;
  --couleur-accent: #7aa5ff;
  --couleur-accent-appuye: #a3c0ff;
  --couleur-accent-contraste: #0b1220;
  --couleur-succes-fond: #14361f;
  --couleur-succes-texte: #bbf7d0;
  --couleur-echec-fond: #45161a;
  --couleur-echec-texte: #fecaca;
  --couleur-avertissement-fond: #3f2f10;
  --couleur-avertissement-texte: #fde68a;
  --couleur-focus: #fbbf24;
  --couleur-voile-accent: rgba(122, 165, 255, 0.16);
  --ombre-basse: 0 1px 3px rgba(0, 0, 0, 0.5);
  --ombre-moyenne: 0 6px 18px rgba(0, 0, 0, 0.55);
}

/* ===== base.css ===== */
/* ==========================================================================
   base.css — Reinitialisation legere, typographie et regles d'accessibilite
   ========================================================================== */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family: var(--police-principale);
  font-size: var(--taille-base);
  line-height: var(--hauteur-ligne);
  color: var(--couleur-texte);
  background-color: var(--couleur-fond);
  transition: background-color var(--duree-transition) ease,
    color var(--duree-transition) ease;
  -webkit-font-smoothing: antialiased;
}

h1,
h2,
h3,
h4 {
  line-height: 1.25;
  margin: 0 0 var(--espace-s);
  font-weight: 700;
}

h1 {
  font-size: clamp(1.85rem, 1.2rem + 2.4vw, 2.75rem);
}

h2 {
  font-size: clamp(1.4rem, 1.1rem + 1.2vw, 1.9rem);
}

h3 {
  font-size: 1.2rem;
}

p {
  margin: 0 0 var(--espace-s);
}

ul,
ol {
  margin: 0;
  padding: 0;
}

li {
  list-style: none;
}

img {
  max-width: 100%;
  height: auto;
  display: block;
}

a {
  color: var(--couleur-accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
}

a:hover {
  color: var(--couleur-accent-appuye);
}

/* Indicateur de focus visible et contraste sur tout element interactif :
   exigence d'accessibilite pour la navigation au clavier. */
a:focus-visible,
button:focus-visible,
input:focus-visible,
textarea:focus-visible,
[tabindex]:focus-visible {
  outline: 3px solid var(--couleur-focus);
  outline-offset: 2px;
  border-radius: var(--rayon-s);
}

/* Le contenu principal recoit le focus lors des changements de route ; on
   masque le liseré par defaut du navigateur pour ce cas particulier. */
main:focus {
  outline: none;
}

/* Contenu reserve aux lecteurs d'ecran. */
.sr-seulement {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* Lien d'evitement : invisible jusqu'a la prise de focus au clavier. */
.lien-evitement {
  position: absolute;
  top: -100px;
  left: var(--espace-s);
  z-index: 100;
  padding: var(--espace-s) var(--espace-m);
  background-color: var(--couleur-accent);
  color: var(--couleur-accent-contraste);
  border-radius: var(--rayon-s);
  text-decoration: none;
  transition: top var(--duree-transition) ease;
}

.lien-evitement:focus {
  top: var(--espace-s);
}

/* Respect de la preference systeme de reduction des animations. */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* ===== layout.css ===== */
/* ==========================================================================
   layout.css — Gabarit general : entete, navigation, sections, grilles, pied
   Mise en page realisee exclusivement en Flexbox et CSS Grid (aucun framework).
   ========================================================================== */

.enveloppe-application {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.conteneur {
  width: 100%;
  max-width: var(--largeur-conteneur);
  margin: 0 auto;
  padding: 0 var(--espace-m);
}

.conteneur--etroit {
  max-width: var(--largeur-conteneur-etroit);
}

/* ------------------------------- Entete --------------------------------- */

.entete {
  position: sticky;
  top: 0;
  z-index: 50;
  background-color: var(--couleur-surface);
  border-bottom: 1px solid var(--couleur-bordure);
  box-shadow: var(--ombre-basse);
}

.entete__interieur {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--espace-s);
  padding-top: var(--espace-s);
  padding-bottom: var(--espace-s);
}

.entete__marque {
  display: flex;
  align-items: center;
  gap: var(--espace-s);
  text-decoration: none;
  color: inherit;
}

.entete__logo {
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  border-radius: var(--rayon-m);
  background-color: var(--couleur-accent);
  color: var(--couleur-accent-contraste);
  font-family: var(--police-monospace);
  font-weight: 700;
  font-size: 0.9rem;
}

.entete__textes {
  display: flex;
  flex-direction: column;
  line-height: 1.2;
}

.entete__titre {
  font-weight: 700;
}

.entete__sous-titre {
  font-size: 0.8rem;
  color: var(--couleur-texte-discret);
}

.entete__hamburger {
  display: none;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  width: 44px;
  height: 44px;
  padding: 0 10px;
  background-color: transparent;
  border: 1px solid var(--couleur-bordure);
  border-radius: var(--rayon-s);
  cursor: pointer;
}

.entete__barre {
  display: block;
  height: 2px;
  width: 100%;
  background-color: var(--couleur-texte);
}

/* ----------------------------- Navigation -------------------------------- */

.navigation {
  display: flex;
  align-items: center;
  gap: var(--espace-m);
}

.navigation__liste {
  display: flex;
  flex-wrap: wrap;
  gap: var(--espace-xs);
}

.navigation__lien {
  display: inline-block;
  padding: var(--espace-xs) var(--espace-s);
  border-radius: var(--rayon-s);
  color: var(--couleur-texte);
  text-decoration: none;
  font-weight: 600;
}

.navigation__lien:hover {
  background-color: var(--couleur-surface-appuyee);
  color: var(--couleur-texte);
}

.navigation__lien--actif {
  color: var(--couleur-accent);
  background-color: var(--couleur-surface-appuyee);
}

.preferences {
  display: flex;
  align-items: center;
  gap: var(--espace-xs);
}

/* ------------------------------ Sections --------------------------------- */

.contenu-principal {
  flex: 1 1 auto;
}

.section {
  padding: var(--espace-xl) 0;
}

.section--alternee {
  background-color: var(--couleur-fond-alterne);
}

.section__titre {
  margin-bottom: var(--espace-s);
}

.section__sous-titre {
  margin-top: var(--espace-l);
  margin-bottom: var(--espace-xs);
  font-size: 1.25rem;
}

.section__introduction {
  max-width: 68ch;
  color: var(--couleur-texte-discret);
  margin-bottom: var(--espace-l);
}

.section__introduction--discrete {
  font-size: 0.92rem;
  margin-bottom: var(--espace-m);
}

/* ------------------------------ Banniere --------------------------------- */

.banniere {
  padding: var(--espace-xl) 0;
  background-color: var(--couleur-fond-alterne);
  background-image: radial-gradient(
    circle at 15% 20%,
    var(--couleur-voile-accent),
    rgba(0, 0, 0, 0) 55%
  );
  border-bottom: 1px solid var(--couleur-bordure);
}

.banniere__interieur {
  max-width: 74ch;
}

.banniere__surtitre {
  text-transform: uppercase;
  letter-spacing: 0.09em;
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--couleur-accent);
  margin-bottom: var(--espace-xs);
}

.banniere__texte {
  font-size: 1.06rem;
  color: var(--couleur-texte-discret);
  margin-bottom: var(--espace-m);
}

.banniere__actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--espace-s);
}

/* ------------------------------- Grilles --------------------------------- */

.grille {
  display: grid;
  gap: var(--espace-m);
}

.grille--trois {
  grid-template-columns: repeat(auto-fit, minmax(255px, 1fr));
}

.grille--projets {
  grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
}

.grille--membres {
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
}

.grille--chiffres {
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
}

/* -------------------------------- Pied ----------------------------------- */

.pied {
  margin-top: auto;
  padding: var(--espace-l) 0;
  background-color: var(--couleur-surface);
  border-top: 1px solid var(--couleur-bordure);
}

.pied__ligne {
  margin-bottom: var(--espace-xs);
}

.pied__ligne--discrete {
  color: var(--couleur-texte-discret);
  font-size: 0.88rem;
}

/* --------------------- Adaptation aux formats mobiles -------------------- */

@media (max-width: 760px) {
  .entete__hamburger {
    display: flex;
  }

  .navigation {
    display: none;
    flex-basis: 100%;
    flex-direction: column;
    align-items: stretch;
    gap: var(--espace-s);
    padding-top: var(--espace-s);
  }

  .navigation--ouverte {
    display: flex;
  }

  .navigation__liste {
    flex-direction: column;
  }

  .navigation__lien {
    display: block;
    padding: var(--espace-s);
  }

  .preferences {
    justify-content: flex-start;
    flex-wrap: wrap;
  }

  .section {
    padding: var(--espace-l) 0;
  }
}

/* ===== composants.css ===== */
/* ==========================================================================
   composants.css — Boutons, cartes, etiquettes, formulaire, alertes,
   indicateurs de chargement et statistiques.
   ========================================================================== */

/* ------------------------------- Boutons --------------------------------- */

.bouton {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--espace-xs);
  padding: 0.62rem 1.05rem;
  border: 1px solid transparent;
  border-radius: var(--rayon-s);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  transition: background-color var(--duree-transition) ease,
    border-color var(--duree-transition) ease, transform var(--duree-transition) ease;
}

.bouton:active {
  transform: translateY(1px);
}

.bouton[disabled] {
  opacity: 0.6;
  cursor: not-allowed;
}

.bouton--principal {
  background-color: var(--couleur-accent);
  color: var(--couleur-accent-contraste);
}

.bouton--principal:hover {
  background-color: var(--couleur-accent-appuye);
  color: var(--couleur-accent-contraste);
}

.bouton--secondaire {
  background-color: transparent;
  border-color: var(--couleur-accent);
  color: var(--couleur-accent);
}

.bouton--secondaire:hover {
  background-color: var(--couleur-surface-appuyee);
}

.bouton--discret {
  background-color: var(--couleur-surface-appuyee);
  color: var(--couleur-texte);
  padding: 0.4rem 0.75rem;
  font-size: 0.9rem;
}

.bouton--discret:hover {
  background-color: var(--couleur-bordure);
  color: var(--couleur-texte);
}

.bouton--icone {
  width: 40px;
  height: 40px;
  padding: 0;
  font-size: 1.15rem;
  background-color: var(--couleur-surface-appuyee);
  color: var(--couleur-texte);
}

.bouton--filtre {
  background-color: var(--couleur-surface);
  border-color: var(--couleur-bordure);
  color: var(--couleur-texte);
  padding: 0.4rem 0.85rem;
  font-size: 0.9rem;
}

.bouton--filtre:hover {
  background-color: var(--couleur-surface-appuyee);
}

.bouton--filtre-actif {
  background-color: var(--couleur-accent);
  border-color: var(--couleur-accent);
  color: var(--couleur-accent-contraste);
}

.lien-simple,
.lien-externe {
  font-weight: 600;
}

/* -------------------------------- Cartes --------------------------------- */

.carte {
  height: 100%;
  background-color: var(--couleur-surface);
  border: 1px solid var(--couleur-bordure);
  border-radius: var(--rayon-m);
  box-shadow: var(--ombre-basse);
  overflow: hidden;
  transition: box-shadow var(--duree-transition) ease,
    transform var(--duree-transition) ease;
}

.carte:hover {
  box-shadow: var(--ombre-moyenne);
  transform: translateY(-2px);
}

.carte-competence {
  padding: var(--espace-m);
}

.carte-competence__texte {
  color: var(--couleur-texte-discret);
  margin-bottom: 0;
}

.carte-chiffre {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: var(--espace-m);
  text-align: center;
}

.carte-chiffre__valeur {
  font-size: 2.4rem;
  font-weight: 800;
  color: var(--couleur-accent);
  line-height: 1.1;
}

.carte-chiffre__intitule {
  color: var(--couleur-texte-discret);
  font-size: 0.9rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

/* Carte membre */

.carte-membre {
  display: flex;
  flex-direction: column;
}

.carte-membre__photo {
  width: 100%;
  height: 190px;
  object-fit: cover;
  background-color: var(--couleur-surface-appuyee);
}

.carte-membre__corps {
  padding: var(--espace-m);
  display: flex;
  flex-direction: column;
  gap: var(--espace-xs);
}

.carte-membre__nom {
  margin-bottom: 0;
}

.carte-membre__role {
  color: var(--couleur-accent);
  font-weight: 600;
  margin-bottom: 0;
}

.carte-membre__bio {
  color: var(--couleur-texte-discret);
  font-size: 0.94rem;
}

.carte-membre__sous-titre {
  margin: var(--espace-xs) 0 0;
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--couleur-texte-discret);
}

.carte-membre__liens {
  margin-top: auto;
  margin-bottom: 0;
  padding-top: var(--espace-s);
}

/* Carte projet */

.carte-projet {
  display: flex;
  flex-direction: column;
}

.carte-projet__bandeau {
  display: grid;
  place-items: center;
  height: 110px;
}

.carte-projet__initiales {
  font-size: 2.2rem;
  font-weight: 800;
  color: #ffffff;
  letter-spacing: 0.08em;
}

.carte-projet__corps {
  display: flex;
  flex-direction: column;
  gap: var(--espace-xs);
  padding: var(--espace-m);
  flex: 1 1 auto;
}

.carte-projet__titre {
  margin-bottom: 0;
}

.carte-projet__lien {
  color: inherit;
  text-decoration: none;
}

.carte-projet__lien:hover {
  color: var(--couleur-accent);
  text-decoration: underline;
}

.carte-projet__resume {
  color: var(--couleur-texte-discret);
  font-size: 0.94rem;
}

.carte-projet__pied {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--espace-s);
  margin-top: auto;
  margin-bottom: 0;
  padding-top: var(--espace-s);
}

.carte-projet__annee {
  color: var(--couleur-texte-discret);
  font-size: 0.88rem;
  font-variant-numeric: tabular-nums;
}

/* ------------------------------ Etiquettes ------------------------------- */

.liste-etiquettes {
  display: flex;
  flex-wrap: wrap;
  gap: var(--espace-xs);
}

.liste-etiquettes--large {
  gap: var(--espace-s);
}

.etiquette {
  display: inline-block;
  padding: 0.22rem 0.6rem;
  border: 1px solid var(--couleur-bordure);
  border-radius: 999px;
  background-color: var(--couleur-surface-appuyee);
  color: var(--couleur-texte);
  font-size: 0.8rem;
  font-weight: 600;
}

.etiquette--grande {
  padding: 0.4rem 0.9rem;
  font-size: 0.9rem;
}

.etiquette--sourdine {
  background-color: transparent;
  color: var(--couleur-texte-discret);
  font-weight: 500;
  align-self: flex-start;
}

/* ------------------------------- Filtrage -------------------------------- */

.filtre {
  margin-bottom: var(--espace-m);
}

.filtre__intitule {
  font-size: 0.9rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--couleur-texte-discret);
  margin-bottom: var(--espace-xs);
}

.filtre__boutons {
  display: flex;
  flex-wrap: wrap;
  gap: var(--espace-xs);
}

.galerie__compteur {
  color: var(--couleur-texte-discret);
  font-size: 0.88rem;
  font-variant-numeric: tabular-nums;
  margin-bottom: var(--espace-m);
}

.message-vide {
  padding: var(--espace-l);
  text-align: center;
  border: 1px dashed var(--couleur-bordure);
  border-radius: var(--rayon-m);
  color: var(--couleur-texte-discret);
}

/* ------------------------------ Formulaire ------------------------------- */

.formulaire {
  display: flex;
  flex-direction: column;
  gap: var(--espace-s);
  max-width: 620px;
}

.champ {
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
  margin-bottom: 0;
}

.champ__libelle {
  font-weight: 600;
}

.champ__mention {
  font-weight: 400;
  font-size: 0.85rem;
  color: var(--couleur-texte-discret);
}

.champ__saisie {
  width: 100%;
  padding: 0.62rem 0.75rem;
  font: inherit;
  color: var(--couleur-texte);
  background-color: var(--couleur-surface);
  border: 1px solid var(--couleur-bordure);
  border-radius: var(--rayon-s);
  transition: border-color var(--duree-transition) ease;
}

.champ__saisie:hover {
  border-color: var(--couleur-accent);
}

.champ__saisie--invalide {
  border-color: var(--couleur-echec-texte);
  border-width: 2px;
}

.champ__erreur {
  color: var(--couleur-echec-texte);
  font-size: 0.88rem;
  font-weight: 600;
}

.formulaire__compteur {
  color: var(--couleur-texte-discret);
  font-size: 0.85rem;
  font-variant-numeric: tabular-nums;
  margin-bottom: 0;
}

.formulaire__actions {
  margin-top: var(--espace-xs);
  margin-bottom: 0;
}

/* -------------------------------- Alertes -------------------------------- */

.alerte {
  padding: var(--espace-s) var(--espace-m);
  border-radius: var(--rayon-m);
  border: 1px solid var(--couleur-bordure);
  margin-bottom: var(--espace-m);
}

.alerte__texte {
  margin-bottom: 0;
  font-weight: 600;
}

.alerte__details {
  margin-top: var(--espace-xs);
  padding-left: var(--espace-m);
}

.alerte__details li {
  list-style: disc;
  font-size: 0.9rem;
}

.alerte--succes {
  background-color: var(--couleur-succes-fond);
  color: var(--couleur-succes-texte);
}

.alerte--echec {
  background-color: var(--couleur-echec-fond);
  color: var(--couleur-echec-texte);
}

.alerte--avertissement {
  background-color: var(--couleur-avertissement-fond);
  color: var(--couleur-avertissement-texte);
  padding: var(--espace-s);
  font-size: 0.88rem;
}

/* ------------------- Indicateur de chargement reseau --------------------- */

.chargement {
  display: flex;
  align-items: center;
  gap: var(--espace-s);
  padding: var(--espace-s) 0;
  color: var(--couleur-texte-discret);
  font-size: 0.9rem;
}

.chargement__rotor {
  width: 18px;
  height: 18px;
  border: 2px solid var(--couleur-bordure);
  border-top-color: var(--couleur-accent);
  border-radius: 50%;
  animation: rotation 800ms linear infinite;
  flex: 0 0 auto;
}

@keyframes rotation {
  to {
    transform: rotate(360deg);
  }
}

/* ------------------------------ Statistiques ----------------------------- */

.statistiques {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--espace-xs);
  margin: var(--espace-xs) 0 0;
  padding: var(--espace-s);
  background-color: var(--couleur-fond-alterne);
  border-radius: var(--rayon-s);
}

.statistiques__element {
  text-align: center;
}

.statistiques__intitule {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--couleur-texte-discret);
}

.statistiques__valeur {
  margin: 0;
  font-size: 1.35rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.statistiques__valeur--texte {
  font-size: 0.95rem;
  font-weight: 600;
}

/* ------------------------- Detail d'une realisation ---------------------- */

.fil-ariane {
  margin-bottom: var(--espace-s);
}

.detail__bandeau {
  height: 8px;
  border-radius: 999px;
  margin-bottom: var(--espace-m);
}

.detail__actions {
  margin-top: var(--espace-l);
}

.code-erreur {
  font-size: 4rem;
  font-weight: 800;
  color: var(--couleur-accent);
  line-height: 1;
  margin-bottom: 0;
}

@media (max-width: 520px) {
  .statistiques {
    grid-template-columns: 1fr;
    text-align: left;
  }

  .statistiques__element {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: var(--espace-s);
    text-align: left;
  }
}

/* ===== styles propres a l'apercu de demonstration ===== */
.bandeau-demo {
  background-color: var(--couleur-avertissement-fond);
  color: var(--couleur-avertissement-texte);
  border-bottom: 1px solid var(--couleur-bordure);
  font-size: 0.86rem;
}
.bandeau-demo__interieur { padding-top: 0.6rem; padding-bottom: 0.6rem; }
.bandeau-demo strong { font-weight: 700; }
.note-demo {
  margin: 0.35rem 0 0;
  font-size: 0.76rem;
  line-height: 1.4;
  color: var(--couleur-texte-discret);
  font-style: italic;
}

    return Object.prototype.hasOwnProperty.call(dictionnaire, cle)
      ? dictionnaire[cle]
      : cle;
  }

  /* --------------------- Fabrique d'elements du DOM --------------------- */

  /**
   * Cree un element. Le texte est toujours pose par textContent : aucune
   * chaine n'est interpretee comme du balisage.
   * @param {string} balise
   * @param {object} options {classe, texte, attrs, sur}
   * @param {Array} enfants
   */
  function e(balise, options, enfants) {
    var noeud = document.createElement(balise);
    options = options || {};

    if (options.classe) noeud.className = options.classe;
    if (options.texte !== undefined) noeud.textContent = String(options.texte);

    if (options.attrs) {
      Object.keys(options.attrs).forEach(function (nom) {
        var valeur = options.attrs[nom];
        if (valeur !== null && valeur !== undefined && valeur !== false) {
          noeud.setAttribute(nom, String(valeur));
        }
      });
    }

    if (options.sur) {
      Object.keys(options.sur).forEach(function (evenement) {
        noeud.addEventListener(evenement, options.sur[evenement]);
      });
    }

    (enfants || []).forEach(function (enfant) {
      if (enfant) noeud.appendChild(enfant);
    });

    return noeud;
  }

  function vider(noeud) {
    while (noeud.firstChild) noeud.removeChild(noeud.firstChild);
  }

  /* ------------------------------ Routage ------------------------------ */
  /* Le routage se fait par fragment (#/equipe) : c'est la seule technique   */
  /* qui fonctionne en protocole file://. Le projet React utilise, lui, de   */
  /* vraies adresses (/equipe) grace a React Router v6 et au repli Express.  */

  function routeCourante() {
    var brut = window.location.hash.replace(/^#\/?/, '');
    var segments = brut.split('/').filter(Boolean);
    if (segments.length === 0) return { nom: 'accueil' };
    if (segments[0] === 'equipe') return { nom: 'equipe' };
    if (segments[0] === 'projets' && segments[1]) {
      return { nom: 'detail', identifiant: segments[1] };
    }
    if (segments[0] === 'projets') return { nom: 'projets' };
    if (segments[0] === 'contact') return { nom: 'contact' };
    return { nom: 'introuvable' };
  }

  function cheminDeRoute(nom) {
    return nom === 'accueil' ? '#/' : '#/' + nom;
  }

  /* ------------------------------- Equipe ------------------------------ */

  function blocStatistiques(membre) {
    var conteneur = e('div', {});
    conteneur.appendChild(indicateurChargement());

    if (typeof window.fetch !== 'function') {
      vider(conteneur);
      conteneur.appendChild(messageStatsIndisponibles('fetch indisponible'));
      return conteneur;
    }

    window
      .fetch('https://api.github.com/users/' + encodeURIComponent(membre.pseudoGitHub), {
        headers: { Accept: 'application/vnd.github+json' }
      })
      .then(function (reponse) {
        if (!reponse.ok) throw new Error('HTTP ' + reponse.status);
        return reponse.json();
      })
      .then(function (charge) {
        var dateInscription = new Date(charge.created_at).toLocaleDateString(
          etat.langue === 'fr' ? 'fr-CA' : 'en-CA',
          { year: 'numeric', month: 'long' }
        );

        var elements = [
          { intitule: t('equipe.depots'), valeur: charge.public_repos, texte: false },
          { intitule: t('equipe.abonnes'), valeur: charge.followers, texte: false },
          { intitule: t('equipe.membreDepuis'), valeur: dateInscription, texte: true }
        ];

        vider(conteneur);
        conteneur.appendChild(
          e(
            'dl',
            { classe: 'statistiques' },
            elements.map(function (item) {
              return e('div', { classe: 'statistiques__element' }, [
                e('dt', { classe: 'statistiques__intitule', texte: item.intitule }),
                e('dd', {
                  classe:
                    'statistiques__valeur' +
                    (item.texte ? ' statistiques__valeur--texte' : ''),
                  texte: item.valeur
                })
              ]);
            })
          )
        );
      })
      .catch(function (exception) {
        vider(conteneur);
        conteneur.appendChild(messageStatsIndisponibles(exception.message));
      });

    return conteneur;
  }

  /**
   * En protocole file://, l'origine de la page vaut « null » : l'API de GitHub
   * refuse alors la requete (politique d'origine croisee). Plutot que d'afficher
   * une erreur brute, l'apercu montre des valeurs d'exemple clairement
   * identifiees comme telles. Une fois le projet React servi par Vite ou par
   * Express, l'appel reel fonctionne et affiche les vraies statistiques.
   */
  function messageStatsIndisponibles(detail) {
    var exemples = [
      { intitule: t('equipe.depots'), valeur: '—', texte: false },
      { intitule: t('equipe.abonnes'), valeur: '—', texte: false },
      { intitule: t('equipe.membreDepuis'), valeur: '—', texte: true }
    ];

    var bloc = e('div', {});

    bloc.appendChild(
      e(
        'dl',
        { classe: 'statistiques' },
        exemples.map(function (item) {
          return e('div', { classe: 'statistiques__element' }, [
            e('dt', { classe: 'statistiques__intitule', texte: item.intitule }),
            e('dd', {
              classe:
                'statistiques__valeur' +
                (item.texte ? ' statistiques__valeur--texte' : ''),
              texte: item.valeur
            })
          ]);
        })
      )
    );

    bloc.appendChild(
      e('p', {
        classe: 'note-demo',
        attrs: { role: 'status' },
        texte:
          etat.langue === 'fr'
            ? 'Statistiques non chargées en mode fichier — l’API GitHub refuse les appels d’origine « null ». Elles s’affichent normalement dès que le projet est servi par npm run dev. (' +
              detail +
              ')'
            : 'Statistics not loaded in file mode — the GitHub API rejects requests from a "null" origin. They display normally once the project is served by npm run dev. (' +
              detail +
              ')'
      })
    );

    return bloc;
  }

          }),
          e('p', {
            classe: 'section__introduction',
            texte: projet.resume[etat.langue]
          }),
          e('h2', { classe: 'section__sous-titre', texte: t('projets.contexte') }),
          e('p', { texte: projet.contexte[etat.langue] }),
          e('h2', {
            classe: 'section__sous-titre',
            texte: t('projets.contribution')
          }),
          e('p', { texte: projet.contribution[etat.langue] }),
          e('h2', {
            classe: 'section__sous-titre',
            texte: t('projets.technologies')
          }),
          etiquettes(projet.technologies),
          e('p', { classe: 'detail__actions' }, [
            e('a', {
              classe: 'bouton bouton--principal',
              texte: t('projets.depot'),
              attrs: {
                href: projet.lienDepot,
                target: '_blank',
                rel: 'noopener noreferrer'
              }
            })
          ])
        ])
      ]
    );
  }

  /* ------------------------------ Contact ------------------------------ */

  var LONGUEUR_MAX_MESSAGE = 2000;
  var MOTIF_COURRIEL = /^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i;

  function validerChamp(nom, valeur) {
    var contenu = String(valeur).trim();
    if (nom === 'nom') return contenu.length >= 2 ? '' : t('contact.erreurNom');
    if (nom === 'courriel') {
      return MOTIF_COURRIEL.test(contenu) ? '' : t('contact.erreurCourriel');
    }
    if (nom === 'sujet') return contenu.length >= 3 ? '' : t('contact.erreurSujet');
    if (nom === 'message') {
      return contenu.length >= 10 ? '' : t('contact.erreurMessage');
    }
    return '';
  }

  function champFormulaire(config) {
    var identifiantErreur = config.identifiant + '-erreur';

    var saisie = e(config.multiligne ? 'textarea' : 'input', {
      classe: 'champ__saisie',
      attrs: {
        id: config.identifiant,
        name: config.nom,
        type: config.multiligne ? null : config.type || 'text',
        rows: config.multiligne ? 7 : null,
        maxlength: config.longueurMax,
        autocomplete: config.autoComplete,
        required: 'required',
        'aria-invalid': 'false'
      }
    });

    var zoneErreur = e('span', {
      classe: 'champ__erreur',
      attrs: { id: identifiantErreur, role: 'alert' }
    });
    zoneErreur.hidden = true;

    function afficherErreur(message) {
      if (message) {
        zoneErreur.textContent = message;
        zoneErreur.hidden = false;
        saisie.setAttribute('aria-invalid', 'true');
        saisie.setAttribute('aria-describedby', identifiantErreur);
        saisie.classList.add('champ__saisie--invalide');
      } else {
        zoneErreur.textContent = '';
        zoneErreur.hidden = true;
        saisie.setAttribute('aria-invalid', 'false');
        saisie.removeAttribute('aria-describedby');
        saisie.classList.remove('champ__saisie--invalide');
      }
    }

    saisie.addEventListener('blur', function () {
      afficherErreur(validerChamp(config.nom, saisie.value));
    });
    saisie.addEventListener('input', function () {
      if (!zoneErreur.hidden) {
        afficherErreur(validerChamp(config.nom, saisie.value));
      }
      if (config.surSaisie) config.surSaisie(saisie.value);
    });

    var libelle = e('label', {
      classe: 'champ__libelle',
      attrs: { for: config.identifiant }
    });
    libelle.appendChild(document.createTextNode(config.libelle));
    libelle.appendChild(
      e('span', {
        classe: 'champ__mention',
        texte: ' (' + t('contact.obligatoire') + ')'
      })
    );

    var bloc = e('p', { classe: 'champ' }, [libelle, saisie, zoneErreur]);

    return { bloc: bloc, saisie: saisie, afficherErreur: afficherErreur };
  }

  function pageContact() {
    var zoneReponse = e('div', { attrs: { 'aria-live': 'polite' } });
    var compteur = e('p', {
      classe: 'formulaire__compteur',
      texte: '0 / ' + LONGUEUR_MAX_MESSAGE + ' ' + t('contact.compteur'),
      attrs: { 'aria-live': 'polite' }
    });

    var champs = [
      champFormulaire({
        identifiant: 'champ-nom',
        nom: 'nom',
        libelle: t('contact.nom'),
        autoComplete: 'name',
        longueurMax: 80
      }),
      champFormulaire({
        identifiant: 'champ-courriel',
        nom: 'courriel',
        type: 'email',
        libelle: t('contact.courriel'),
        autoComplete: 'email',
        longueurMax: 120
      }),
      champFormulaire({
        identifiant: 'champ-sujet',
        nom: 'sujet',
        libelle: t('contact.sujet'),
        longueurMax: 120
      }),
      champFormulaire({
        identifiant: 'champ-message',
        nom: 'message',
        libelle: t('contact.message'),
        multiligne: true,
        longueurMax: LONGUEUR_MAX_MESSAGE,
        surSaisie: function (valeur) {
          compteur.textContent =
            valeur.length + ' / ' + LONGUEUR_MAX_MESSAGE + ' ' + t('contact.compteur');
        }
      })
    ];

    var bouton = e('button', {
      classe: 'bouton bouton--principal',
      texte: t('contact.envoyer'),
      attrs: { type: 'submit' }
    });

    var formulaire = e(
      'form',
      { classe: 'formulaire', attrs: { novalidate: 'novalidate' } },
      champs
        .map(function (champ) {
          return champ.bloc;
        })
        .concat([compteur, e('p', { classe: 'formulaire__actions' }, [bouton])])
    );

    formulaire.addEventListener('submit', function (evenement) {
      evenement.preventDefault();
      vider(zoneReponse);

      var valeurs = {};
      var premierInvalide = null;

      champs.forEach(function (champ) {
        var nom = champ.saisie.getAttribute('name');
        valeurs[nom] = champ.saisie.value;
        var message = validerChamp(nom, champ.saisie.value);
        champ.afficherErreur(message);
        if (message && !premierInvalide) premierInvalide = champ.saisie;
      });

      if (premierInvalide) {
        premierInvalide.focus();
        return;
      }

      // En mode fichier, aucun serveur Express n'ecoute : on montre la charge
      // utile qui serait transmise a POST /api/contact dans le vrai projet.
      var apercu = JSON.stringify(valeurs, null, 2);

      zoneReponse.appendChild(
        e('div', { classe: 'alerte alerte--succes', attrs: { role: 'status' } }, [
          e('p', {
            classe: 'alerte__texte',
            texte:
              etat.langue === 'fr'
                ? 'Validation cote client reussie.'
                : 'Client-side validation passed.'
          }),
          e('p', {
            texte:
              etat.langue === 'fr'
                ? 'Mode demo : aucun serveur Express n’ecoute. Dans le projet React, cette charge utile serait envoyee en POST vers /api/contact, revalidee, puis ajoutee a messages.json.'
                : 'Demo mode: no Express server is listening. In the React project this payload would be POSTed to /api/contact, revalidated, then appended to messages.json.'
          }),
          e('pre', {
            texte: apercu,
            attrs: {
              style:
                'background:rgba(0,0,0,0.06);padding:8px;border-radius:6px;overflow:auto;font-size:0.8rem;margin:0;'
            }
          })
        ])
      );

      champs.forEach(function (champ) {
        champ.saisie.value = '';
      });
      compteur.textContent =
        '0 / ' + LONGUEUR_MAX_MESSAGE + ' ' + t('contact.compteur');
    });

    return e(
      'section',
      { classe: 'section', attrs: { 'aria-labelledby': 'titre-contact' } },
      [
        e('div', { classe: 'conteneur conteneur--etroit' }, [
          e('h1', {
            classe: 'section__titre',
            texte: t('contact.titre'),
            attrs: { id: 'titre-contact' }
          }),
          e('p', { classe: 'section__introduction', texte: t('contact.intro') }),
          zoneReponse,
          formulaire
        ])
      ]
    );
  }

  /* ------------------------------- 404 --------------------------------- */

  function pageIntrouvable() {
    return e(
      'section',
      { classe: 'section', attrs: { 'aria-labelledby': 'titre-404' } },
      [
        e('div', { classe: 'conteneur conteneur--etroit' }, [
          e('p', {
            classe: 'code-erreur',
            texte: '404',
            attrs: { 'aria-hidden': 'true' }
          }),
          e('h1', {
            classe: 'section__titre',
            texte: t('nonTrouvee.titre'),
            attrs: { id: 'titre-404' }
          }),
          e('p', {
            classe: 'section__introduction',
            texte: t('nonTrouvee.texte')
          }),
          e('p', {}, [
            e('a', {
              classe: 'bouton bouton--principal',
              texte: t('nonTrouvee.retour'),
              attrs: { href: '#/' }
            })
          ])
        ])
      ]
    );
  }

  /* --------------------------- Bandeau demo ---------------------------- */

  function bandeauDemo() {
    var barre = e('div', { classe: 'bandeau-demo' }, [
      e('div', { classe: 'conteneur bandeau-demo__interieur' }, [
        e('strong', { texte: 'Aperçu de démonstration' }),
        e('span', {
          texte:
            ' — fichier unique en JavaScript natif, sans React ni serveur. ' +
            'Le livrable du projet est l’application du dossier ' +
            'portfolio-log3500/ (npm install, puis npm run dev). ' +
            'Ici les adresses utilisent un fragment (#/equipe) et le formulaire ' +
            'n’atteint aucun serveur.'
        })
      ])
    ]);
    return barre;
  }

  /* ------------------------------- Rendu ------------------------------- */

  function rendre() {
    var racine = document.getElementById('racine');
    vider(racine);

    var route = routeCourante();

    var contenu;
    if (route.nom === 'accueil') contenu = pageAccueil();
    else if (route.nom === 'equipe') contenu = pageEquipe();
    else if (route.nom === 'projets') contenu = pageProjets();
    else if (route.nom === 'detail') contenu = pageDetail(route.identifiant);
    else if (route.nom === 'contact') contenu = pageContact();
    else contenu = pageIntrouvable();

    var titres = {
      accueil: t('nav.accueil'),
      equipe: t('nav.equipe'),
      projets: t('nav.projets'),
      detail: t('nav.projets'),
      contact: t('nav.contact'),
      introuvable: t('nonTrouvee.titre')
    };
    document.title = titres[route.nom] + ' | ' + t('entete.titre');

    var lienEvitement = e('a', {
      classe: 'lien-evitement',
      texte: t('nav.evitement'),
      attrs: { href: '#contenu-principal' }
    });

    var principal = e('main', {
      classe: 'contenu-principal',
      attrs: { id: 'contenu-principal', tabindex: '-1' }
    });
    principal.appendChild(contenu);

    var enveloppe = e('div', { classe: 'enveloppe-application' }, [
      lienEvitement,
      bandeauDemo(),
      construireEntete(),
      principal,
      construirePied()
    ]);

    racine.appendChild(enveloppe);
  }

  /* --------------------------- Initialisation -------------------------- */

  try {
    var preferenceSysteme = window.matchMedia('(prefers-color-scheme: dark)');
    etat.theme = preferenceSysteme.matches ? 'sombre' : 'clair';
  } catch (exception) {
    etat.theme = 'clair';
  }

  document.documentElement.setAttribute('data-theme', etat.theme);
  document.documentElement.setAttribute('lang', etat.langue);

  window.addEventListener('hashchange', function () {
    etat.menuOuvert = false;
    rendre();
    var principal = document.getElementById('contenu-principal');
    if (principal) principal.focus();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  rendre();

  if (MODE_FICHIER) {
    console.info(
      'Portfolio LOG3500 — aperçu de démonstration ouvert en protocole file://. ' +
        'Le projet React se lance avec : npm install puis npm run dev.'
    );
  }
})();

</script>
